name: Add OpenThomas entry

on:
  push:
    branches:
      - add-openthomas

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-openthomas
          fetch-depth: 0
      - name: Add OpenThomas to AI Agents
        shell: python
        run: |
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text()
          entry = "- [OpenThomas](https://github.com/PredictionMarketTrader/openthomas) — Open-source autonomous AI agent for weather prediction markets on Kalshi and Polymarket, combining multi-model forecasts, per-station bias calibration, bounded LLM adjustments, and risk-limited fractional Kelly sizing. MIT licensed."
          needle = "- [Octagon AI](https://octagonai.co/?utm_source=polymark.et) — Intelligence layer for prediction markets, Understand what's moving the market. Delivering deep research reports with model forecasts and fully cited sources."
          if entry not in text:
              if needle not in text:
                  raise SystemExit("Expected Octagon AI entry not found")
              text = text.replace(needle, needle + "\n" + entry, 1)
              path.write_text(text)
      - name: Commit clean README-only change
        run: |
          git config user.name "pachutanco"
          git config user.email "325010933+pachutanco@users.noreply.github.com"
          git rm .github/workflows/add-openthomas.yml
          git add README.md
          git commit -m "Add OpenThomas to AI Agents"
          git push origin add-openthomas
